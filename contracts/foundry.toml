[profile.default]
src = "core"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/"
]
# Note: Foundry doesn't support 'exclude' option, use src/test/script paths instead
build_info = true
extra_output = ["storageLayout"]

[rpc_endpoints]
base = "https://mainnet.base.org"
base_goerli = "https://goerli.base.org"

[etherscan]
base = { key = "${BASESCAN_API_KEY}" }

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000 }
